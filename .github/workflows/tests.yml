name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install dependencies
        # python-dateutil is for the tests only: it reads the exported
        # calendar.ics back (test_group3_data_model, check [13]).
        run: python -m pip install "PySide6>=6.7" "sqlcipher3>=0.6" "pyrage>=1.4" python-dateutil

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py

      # TEMPORARY, branch 1r-ci-fix only (1R-F9, F9-3): never merged into main.
      - name: Stress test_group1_history_recovery 20 times (windows / 3.13)
        if: ${{ always() && runner.os == 'Windows' && matrix.python == '3.13' }}
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 20); do
            if python tests/test_group1_history_recovery.py > "out_$i.txt" 2>&1; then
              echo "iteration $i: PASS ($(tail -1 "out_$i.txt"))"
            else
              echo "iteration $i: FAIL - full output follows"
              cat "out_$i.txt"
              fails=$((fails + 1))
            fi
          done
          echo "failures: $fails of 20"
          test "$fails" -eq 0
