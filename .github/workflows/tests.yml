name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Exact patch versions (FP-16): 3.13.2 is the local .venv's, so local
        # and CI evidence come from the same Python.
        python: ["3.11.9", "3.13.2"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install dependencies
        # One list (requirements.txt) at exact versions (constraints.txt),
        # the same as the local .venv and the Windows build (FP-1, FP-16).
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip freeze --all

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py
